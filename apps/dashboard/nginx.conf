server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Urumi-API-Key $http_x_urumi_api_key;
        proxy_set_header Authorization "Bearer $http_x_urumi_api_key";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
